# The command that bridges to UniGen, the SAT-based almost-uniform sampler.
# UniGen is a native tool rather than a library, so it runs as a separate
# process; see scripts/unigen_bridge.py for the protocol. Override with
# ESGFX_UNIGEN_COMMAND to point at another interpreter or another sampler,
# for example a virtualenv that has pyunigen installed.
esgfx.unigen.command=python3,scripts/unigen_bridge.py

# Static assets are served under a content-hashed name, so a changed file gets a
# changed URL. Without this a browser can keep serving a stale app.js from an
# earlier visit, which looks exactly like the new code being broken.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.cache-public=true
spring.web.resources.cache.cachecontrol.max-age=365d
